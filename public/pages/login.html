<!DOCTYPE html>
<html lang="es">
<head>
  <script src="../js/controllers/fetch_con_credenciales.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2D60A1">
  <meta name="description" content="Inicia sesión en el portal de propietarios de PetCore.">
  <title>Acceder | PetCore</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Tema (claro/oscuro/sistema): DESPUÉS de Bootstrap para poder sobreponer
       sus variables --bs-* y ANTES de style.css / que pinte nada. -->
  <script src="../js/services/sesion_temprana_service.js"></script>
  <script src="../js/controllers/tema_temprano_login.js"></script>
  <link href="../css/style.css" rel="stylesheet">
  <!-- Animaciones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body>

  <div class="pc-tema-toggle" role="group" aria-label="Tema de la pantalla">
    <button type="button" class="pc-tema-toggle-btn" id="pcTemaClaro" data-tema="claro"
            aria-pressed="false" aria-label="Tema claro" title="Claro">
      <i class="fa-solid fa-sun"></i>
    </button>
    <button type="button" class="pc-tema-toggle-btn" id="pcTemaOscuro" data-tema="oscuro"
            aria-pressed="false" aria-label="Tema oscuro" title="Oscuro">
      <i class="fa-solid fa-moon"></i>
    </button>
    <button type="button" class="pc-tema-toggle-btn" id="pcTemaSistema" data-tema="sistema"
            aria-pressed="false" aria-label="Sincronizar con el sistema" title="Sistema">
      <i class="fa-solid fa-circle-half-stroke"></i>
    </button>
  </div>

  <main class="pc-acceso">
    <div class="pc-acceso-caja animate__animated animate__fadeInUp animate__faster">

      <div class="text-center mb-4">
        <img src="../img/logo.svg" alt="PetCore" class="pc-logo-acceso pc-logo-clara">
        <img src="../img/logo_blanco.svg" alt="PetCore" class="pc-logo-acceso pc-logo-oscura">
      </div>

      <div class="pc-card p-4">
        <h1 class="h5 mb-1">Inicia sesión</h1>
        <p class="text-secondary small mb-4">Entra con el usuario que te dieron en recepción.</p>

        <div id="pcLoginError" class="alert alert-danger py-2 small d-none" role="alert"></div>

        <form id="pcFormLogin" novalidate>

          <div class="mb-3">
            <label for="pcUsuario" class="form-label">Correo electrónico</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-envelope text-secondary"></i></span>
              <input type="email" class="form-control" id="pcUsuario" name="correo"
                     autocomplete="email" placeholder="jperez@correo.com" required>
            </div>
          </div>

          <div class="mb-4">
            <label for="pcClave" class="form-label">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-lock text-secondary"></i></span>
              <input type="password" class="form-control" id="pcClave" name="clave"
                     autocomplete="current-password" placeholder="••••••••" required>
              <button class="btn btn-outline-secondary" type="button" id="pcVerClave" aria-label="Mostrar contraseña">
                <i class="fa-regular fa-eye-slash"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100" id="pcBtnEntrar">Acceder</button>
        </form>

        <div class="d-flex align-items-center my-3 text-secondary small">
          <hr class="flex-grow-1">
          <span class="mx-2">o</span>
          <hr class="flex-grow-1">
        </div>
        <div id="pcGoogleBtnContenedor" class="d-flex justify-content-center"></div>

        <p class="text-center small text-secondary mt-4 mb-0">
          <a href="recuperar_contrasena.html" class="text-decoration-none fw-semibold">¿Olvidaste tu contraseña?</a>
        </p>
        <p class="text-center small text-secondary mt-1 mb-0">
          ¿No puedes recuperarla? Llama a la clínica al 2200-1188.
        </p>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Sin async/defer, y ANTES del controller (module): un <script>
       clásico corre en el orden en que aparece, así que google.accounts.id
       ya existe para cuando el módulo de abajo (siempre diferido) se ejecute. -->
  <script src="https://accounts.google.com/gsi/client"></script>
  <script type="module" src="../js/controllers/login_controller.js"></script>
</body>
</html>

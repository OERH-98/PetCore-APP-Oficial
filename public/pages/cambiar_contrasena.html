<!DOCTYPE html>
<html lang="es">

<head>
  <script src="../js/controllers/fetch_con_credenciales.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2D60A1">
  <meta name="description" content="Cambia la contraseña de tu cuenta de PetCore.">
  <title>Cambiar contraseña | PetCore</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    rel="stylesheet">
  <!-- Tema (claro/oscuro/sistema): DESPUÉS de Bootstrap para poder sobreponer
       sus variables --bs-* y ANTES de style.css / que pinte nada. -->
  <script src="../js/services/sesion_temprana_service.js"></script>
  <script src="../js/controllers/tema_temprano.js"></script>
  <!-- Estilos propios -->
  <link href="../css/style.css" rel="stylesheet">
  <!-- Animaciones (Preferencias > Accesibilidad puede desactivarlas) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>

<body class="pc-con-header">

  <!-- ================== HEADER SUPERIOR ================== -->
  <header class="pc-header">
    <div class="pc-header-inner">
      <a class="pc-header-btn" href="perfil.html" aria-label="Volver atrás">
        <i class="fa fa-arrow-left"></i>
      </a>
      <h1 class="pc-header-titulo">Cambiar contraseña</h1>
      <span aria-hidden="true"></span>
    </div>
  </header>

  <!-- ================== CONTENIDO ================== -->
  <main class="container pc-lienzo py-4">

    <!-- Paso 1: verificar la contraseña actual -- sin esto verificado no
         tiene caso mostrar los campos de la nueva. -->
    <form class="pc-card p-3 p-sm-4 mb-3 animate__animated animate__fadeInUp animate__faster" id="pcFormVerificar"
      novalidate>
      <div id="pcErrorVerificar" class="alert alert-danger py-2 small d-none" role="alert"></div>

      <p class="pc-meta mb-3"><i class="fa-solid fa-shield-halved me-1"></i>Primero confirma tu contraseña actual.</p>

      <div class="mb-3">
        <label for="pcContrasenaActual" class="form-label">Contraseña actual</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-lock text-secondary"></i></span>
          <input type="password" class="form-control" id="pcContrasenaActual" autocomplete="current-password"
            placeholder="••••••••" required>
          <button class="btn btn-outline-secondary" type="button" id="pcVerActual" aria-label="Mostrar contraseña">
            <i class="fa-regular fa-eye-slash"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100" id="pcBtnVerificar">Verificar</button>
    </form>

    <!-- Paso 2: nueva contraseña -- oculto hasta que el paso 1 se confirme. -->
    <form class="pc-card p-3 p-sm-4 mb-3 d-none animate__animated animate__fadeInUp animate__faster" id="pcFormNueva"
      novalidate>
      <div id="pcErrorNueva" class="alert alert-danger py-2 small d-none" role="alert"></div>

      <p class="pc-meta mb-3"><i class="fa-solid fa-circle-check text-success me-1"></i>Contraseña actual verificada.
        Escribe la nueva.</p>

      <div class="mb-3">
        <label for="pcContrasenaNueva" class="form-label">Nueva contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-key text-secondary"></i></span>
          <input type="password" class="form-control" id="pcContrasenaNueva" autocomplete="new-password"
            placeholder="Mínimo 8 caracteres" minlength="8" maxlength="300" required>
          <button class="btn btn-outline-secondary" type="button" id="pcVerNueva" aria-label="Mostrar contraseña">
            <i class="fa-regular fa-eye-slash"></i>
          </button>
        </div>
      </div>

      <div class="mb-4">
        <label for="pcContrasenaConfirmar" class="form-label">Confirmar contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-key text-secondary"></i></span>
          <input type="password" class="form-control" id="pcContrasenaConfirmar" autocomplete="new-password"
            placeholder="Repite la contraseña" minlength="8" maxlength="300" required>
          <button class="btn btn-outline-secondary" type="button" id="pcVerConfirmar" aria-label="Mostrar contraseña">
            <i class="fa-regular fa-eye-slash"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100" id="pcBtnCambiar">Cambiar contraseña</button>
    </form>

    <!-- Confirmación final -- oculto hasta terminar. -->
    <div class="pc-card p-4 text-center d-none animate__animated animate__fadeInUp animate__faster" id="pcExito">
      <i class="fa-solid fa-circle-check text-success mb-2" style="font-size:2.5rem;"></i>
      <p class="fw-semibold mb-1">Contraseña actualizada</p>
      <p class="pc-meta mb-3">Ya puedes seguir usando tu cuenta con normalidad.</p>
      <a class="btn btn-primary w-100" href="perfil.html">Volver a mi perfil</a>
    </div>
  </main>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../js/controllers/cambiar_contrasena_controller.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <script src="../js/controllers/fetch_con_credenciales.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2D60A1">
  <meta name="description" content="Notificaciones de tus mascotas en PetCore: citas, vacunas, antiparasitarios y evolución clínica.">
  <title>Notificaciones | PetCore</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Tema (claro/oscuro/sistema): DESPUÉS de Bootstrap para poder sobreponer
       sus variables --bs-* y ANTES de style.css / que pinte nada. -->
  <script src="../js/services/sesion_temprana_service.js"></script>
  <script src="../js/controllers/tema_temprano.js"></script>
  <!-- Estilos propios -->
  <link href="../css/style.css" rel="stylesheet">
  <!-- Animaciones (Preferencias > Accesibilidad puede desactivarlas) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body class="pc-con-header pc-header--apilado">

  <!-- ================== HEADER SUPERIOR ================== -->
  <header class="pc-header pc-header--apilado">
    <div class="pc-header-inner">
      <a class="pc-header-logo" href="dashboard.html" aria-label="Ir al inicio">
        <img src="../img/logo_blanco.svg" alt="PetCore">
      </a>
      <h1 class="pc-header-titulo">PetCore | Notificaciones</h1>
    </div>
  </header>

  <!-- ================== CONTENIDO ================== -->
  <main class="container pc-lienzo py-4 bottom-nav-spacer">
    <header class="mb-3 animate__animated animate__fadeInUp animate__faster d-flex align-items-center justify-content-between">
      <div>
        <h2 class="h5 mb-1">Notificaciones</h2>
        <p class="pc-meta mb-0" id="pcNotiSubtitulo">Cargando…</p>
      </div>
      <span class="pc-eyebrow" id="pcNotiEnVivo" title="Se actualiza solo, sin recargar">
        <i class="fa-solid fa-tower-broadcast me-1"></i>En vivo
      </span>
    </header>

    <ul class="nav pc-tabs mb-3" id="pcNotiTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="pcTabNoLeidas" data-bs-toggle="tab" data-bs-target="#pcPanelNoLeidas"
                type="button" role="tab" aria-controls="pcPanelNoLeidas" aria-selected="true">
          No leídas
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="pcTabLeidas" data-bs-toggle="tab" data-bs-target="#pcPanelLeidas"
                type="button" role="tab" aria-controls="pcPanelLeidas" aria-selected="false">
          Leídas
        </button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="pcPanelNoLeidas" role="tabpanel" aria-labelledby="pcTabNoLeidas">
        <div id="pcListaNotificaciones">
          <div class="pc-card p-3 mb-2 skeleton" style="height:88px"></div>
          <div class="pc-card p-3 skeleton" style="height:88px"></div>
        </div>
      </div>
      <div class="tab-pane fade" id="pcPanelLeidas" role="tabpanel" aria-labelledby="pcTabLeidas">
        <div id="pcListaLeidas">
          <div class="pc-card p-3 mb-2 skeleton" style="height:88px"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- ================== NAVEGACIÓN INFERIOR ================== -->
  <nav class="pc-bottomnav" id="pcBottomNav" aria-label="Navegación principal">
    <div class="pc-bottomnav-inner">
      <a class="pc-bottomnav-item" href="dashboard.html">
        <i class="fa-solid fa-house"></i><span>Inicio</span>
      </a>
      <a class="pc-bottomnav-item" href="mascotas.html">
        <i class="fa-solid fa-paw"></i><span>Mascotas</span>
      </a>
      <a class="pc-bottomnav-item" href="citas.html">
        <i class="fa-regular fa-calendar-check"></i><span>Citas</span>
      </a>
      <a class="pc-bottomnav-item" href="notificaciones.html">
        <span class="pc-bottomnav-icono"><i class="fa-regular fa-bell"></i><span class="pc-bottomnav-badge d-none" id="pcBadgeNotificaciones"></span></span><span>Notificaciones</span>
      </a>
      <a class="pc-bottomnav-item" href="perfil.html">
        <i class="fa-solid fa-user"></i><span>Perfil</span>
      </a>
    </div>
  </nav>
  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../js/controllers/notificaciones_controller.js"></script>
</body>
</html>

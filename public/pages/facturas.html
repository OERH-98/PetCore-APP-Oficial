<!DOCTYPE html>
<html lang="es">
<head>
  <script src="../js/controllers/fetch_con_credenciales.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2D60A1">
  <meta name="description" content="Historial de pagos y comprobantes de PetCore.">
  <title>Historial de facturas | PetCore</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Tema (claro/oscuro/sistema): DESPUÉS de Bootstrap para poder sobreponer
       sus variables --bs-* y ANTES de style.css / que pinte nada. -->
  <script src="../js/services/sesion_temprana_service.js"></script>
  <script src="../js/controllers/tema_temprano.js"></script>
  <!-- Estilos propios -->
  <link href="../css/style.css" rel="stylesheet">
  <!-- Animaciones (Preferencias > Accesibilidad puede desactivarlas) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body class="pc-con-header">

  <!-- ================== HEADER SUPERIOR ================== -->
  <header class="pc-header">
    <div class="pc-header-inner">
      <a class="pc-header-btn" href="perfil.html" aria-label="Volver atrás">
        <i class="fa fa-arrow-left"></i>
      </a>
      <h1 class="pc-header-titulo">Historial de Facturas</h1>
      <span aria-hidden="true"></span>
    </div>
  </header>

  <!-- ================== CONTENIDO ================== -->
  <main class="container pc-lienzo py-4">
    <section class="pc-card p-3 p-sm-4 mb-4 text-center animate__animated animate__fadeInUp animate__faster">
      <span class="pc-eyebrow d-block mb-2">Total pagado</span>
      <p class="pc-total mb-1 skeleton skeleton-texto" id="pcTotalGastado">$0.00</p>
      <p class="pc-meta mb-0 skeleton skeleton-texto" id="pcDetalleGasto">Cargando…</p>
    </section>

    <h2 class="pc-eyebrow mb-2">Comprobantes</h2>
    <div id="pcListaFacturas">
      <div class="pc-card p-3 mb-2 skeleton" style="height:90px"></div>
      <div class="pc-card p-3 mb-2 skeleton" style="height:90px"></div>
    </div>
  </main>



  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../js/controllers/facturas_controller.js"></script>
</body>
</html>

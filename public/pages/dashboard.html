<!DOCTYPE html>
<html lang="es">
<head>
  <script src="../js/controllers/fetch_con_credenciales.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2D60A1">
  <meta name="description" content="Resumen de tus mascotas y tu próxima cita en PetCore.">
  <title>Inicio | PetCore</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Tema (claro/oscuro/sistema): DESPUÉS de Bootstrap para poder sobreponer
       sus variables --bs-* (si fuera antes, Bootstrap las sobreescribiría
       a las suyas por defecto al cargar después) y ANTES de style.css /
       que pinte nada, para que no parpadee. -->
  <script src="../js/services/sesion_temprana_service.js"></script>
  <script src="../js/controllers/tema_temprano.js"></script>
  <!-- Estilos propios -->
  <link href="../css/style.css" rel="stylesheet">
  <!-- Animaciones (Preferencias > Accesibilidad puede desactivarlas) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body class="pc-con-header pc-header--apilado">

  <!-- ================== HEADER SUPERIOR ================== -->
  <header class="pc-header pc-header--apilado">
    <div class="pc-header-inner">
      <a class="pc-header-logo" href="dashboard.html" aria-label="Ir al inicio">
        <img src="../img/logo_blanco.svg" alt="PetCore">
      </a>
      <h1 class="pc-header-titulo">PetCore | Inicio</h1>
    </div>
  </header>

  <!-- ================== CONTENIDO ================== -->
  <main class="container pc-lienzo py-4 bottom-nav-spacer">
    <section class="pc-card p-3 p-sm-4 mb-3 animate__animated animate__fadeInUp animate__faster d-flex align-items-center gap-3">
      <div class="pc-retrato skeleton skeleton-circulo flex-shrink-0" id="pcSaludoRetrato" aria-hidden="true">
        <img id="pcSaludoFoto" class="d-none" alt="">
        <span class="fw-bold" id="pcSaludoInicial"></span>
      </div>
      <div class="min-w-0">
        <h2 class="h4 mb-1 skeleton skeleton-texto" id="pcSaludo">¡Hola!</h2>
        <p class="pc-meta mb-0 skeleton skeleton-texto" id="pcResumen">Cargando tu resumen…</p>
      </div>
    </section>

    <section class="pc-card p-3 p-sm-4 mb-4 animate__animated animate__fadeInUp animate__faster" id="pcProximaCita" aria-live="polite">
      <span class="pc-eyebrow d-block mb-2 skeleton skeleton-texto">Próxima cita</span>
      <div class="skeleton skeleton-linea mb-2"></div>
      <div class="skeleton skeleton-linea" style="width:60%"></div>
    </section>

    <h2 class="pc-eyebrow mb-2">Mis mascotas</h2>
    <div class="pc-carrusel" id="pcCarrusel">
      <div class="pc-carrusel-item"><div class="pc-retrato skeleton skeleton-circulo mx-auto"></div></div>
      <div class="pc-carrusel-item"><div class="pc-retrato skeleton skeleton-circulo mx-auto"></div></div>
      <div class="pc-carrusel-item"><div class="pc-retrato skeleton skeleton-circulo mx-auto"></div></div>
    </div>

    <a class="btn btn-outline-primary w-100" href="mascotas.html">Ver todas mis mascotas</a>
  </main>


  <!-- ================== NAVEGACIÓN INFERIOR ================== -->
  <nav class="pc-bottomnav" id="pcBottomNav" aria-label="Navegación principal">
    <div class="pc-bottomnav-inner">
      <a class="pc-bottomnav-item" href="dashboard.html">
        <i class="fa-solid fa-house"></i><span>Inicio</span>
      </a>
      <a class="pc-bottomnav-item" href="mascotas.html">
        <i class="fa-solid fa-paw"></i><span>Mascotas</span>
      </a>
      <a class="pc-bottomnav-item" href="citas.html">
        <i class="fa-regular fa-calendar-check"></i><span>Citas</span>
      </a>
      <a class="pc-bottomnav-item" href="notificaciones.html">
        <span class="pc-bottomnav-icono"><i class="fa-regular fa-bell"></i><span class="pc-bottomnav-badge d-none" id="pcBadgeNotificaciones"></span></span><span>Notificaciones</span>
      </a>
      <a class="pc-bottomnav-item" href="perfil.html">
        <i class="fa-solid fa-user"></i><span>Perfil</span>
      </a>
    </div>
  </nav>
  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../js/controllers/dashboard_controller.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <script src="../js/controllers/fetch_con_credenciales.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2D60A1">
  <meta name="description" content="Recupera tu contraseña del portal de propietarios de PetCore.">
  <title>Recuperar contraseña | PetCore</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Tema (claro/oscuro/sistema): DESPUÉS de Bootstrap para poder sobreponer
       sus variables --bs-* y ANTES de style.css / que pinte nada. -->
  <script src="../js/services/sesion_temprana_service.js"></script>
  <script src="../js/controllers/tema_temprano_login.js"></script>
  <link href="../css/style.css" rel="stylesheet">
  <!-- Animaciones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body>

  <div class="pc-tema-toggle" role="group" aria-label="Tema de la pantalla">
    <button type="button" class="pc-tema-toggle-btn" id="pcTemaClaro" data-tema="claro"
            aria-pressed="false" aria-label="Tema claro" title="Claro">
      <i class="fa-solid fa-sun"></i>
    </button>
    <button type="button" class="pc-tema-toggle-btn" id="pcTemaOscuro" data-tema="oscuro"
            aria-pressed="false" aria-label="Tema oscuro" title="Oscuro">
      <i class="fa-solid fa-moon"></i>
    </button>
    <button type="button" class="pc-tema-toggle-btn" id="pcTemaSistema" data-tema="sistema"
            aria-pressed="false" aria-label="Sincronizar con el sistema" title="Sistema">
      <i class="fa-solid fa-circle-half-stroke"></i>
    </button>
  </div>

  <main class="pc-acceso">
    <div class="pc-acceso-caja animate__animated animate__fadeInUp animate__faster">

      <div class="text-center mb-4">
        <img src="../img/logo.svg" alt="PetCore" class="pc-logo-acceso pc-logo-clara">
        <img src="../img/logo_blanco.svg" alt="PetCore" class="pc-logo-acceso pc-logo-oscura">
      </div>

      <div class="pc-card p-4">

        <div id="pcRecuperarError" class="alert alert-danger py-2 small d-none" role="alert"></div>

        <!-- ===== Paso 1: pedir el correo ===== -->
        <div id="pcPasoCorreo">
          <h1 class="h5 mb-1">Recuperar contraseña</h1>
          <p class="text-secondary small mb-4">Escribe el correo con el que te registraste en la clínica.</p>

          <form id="pcFormCorreo" novalidate>
            <div class="mb-4">
              <label for="pcCorreoRecuperar" class="form-label">Correo electrónico</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-envelope text-secondary"></i></span>
                <input type="email" class="form-control" id="pcCorreoRecuperar" name="correo"
                       autocomplete="email" placeholder="jperez@correo.com" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100" id="pcBtnEnviarCodigo">Enviar código</button>
          </form>
        </div>

        <!-- ===== Paso 2: verificar el código ===== -->
        <div id="pcPasoCodigo" class="d-none">
          <h1 class="h5 mb-1">Revisa tu correo</h1>
          <p class="text-secondary small mb-4">
            Si <strong id="pcCorreoConfirmado">tu correo</strong> está registrado, te enviamos un código de
            verificación. Escríbelo abajo. Vence en 10 minutos.
          </p>

          <form id="pcFormCodigo" novalidate>
            <div class="mb-4">
              <label for="pcCodigoRecuperar" class="form-label visually-hidden">Código de verificación</label>
              <input type="text" class="form-control text-center" id="pcCodigoRecuperar" name="codigo"
                     inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required
                     style="letter-spacing: .5em; font-size: 1.4rem;">
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3" id="pcBtnVerificarCodigo">Verificar código</button>
          </form>

          <button type="button" class="btn btn-outline-secondary w-100" id="pcBtnReenviarCodigo">Reenviar código</button>
        </div>

        <!-- ===== Paso 3: nueva contraseña ===== -->
        <div id="pcPasoNuevaClave" class="d-none">
          <h1 class="h5 mb-1">Crea tu nueva contraseña</h1>
          <p class="text-secondary small mb-4">Debe tener al menos 8 caracteres.</p>

          <form id="pcFormNuevaClave" novalidate>
            <div class="mb-3">
              <label for="pcClaveNueva" class="form-label">Nueva contraseña</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock text-secondary"></i></span>
                <input type="password" class="form-control" id="pcClaveNueva" name="claveNueva"
                       autocomplete="new-password" placeholder="••••••••" required>
                <button class="btn btn-outline-secondary" type="button" id="pcVerClaveNueva" aria-label="Mostrar contraseña">
                  <i class="fa-regular fa-eye-slash"></i>
                </button>
              </div>
            </div>
            <div class="mb-4">
              <label for="pcClaveConfirmar" class="form-label">Confirmar nueva contraseña</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock text-secondary"></i></span>
                <input type="password" class="form-control" id="pcClaveConfirmar" name="claveConfirmar"
                       autocomplete="new-password" placeholder="••••••••" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100" id="pcBtnRestablecerClave">Restablecer contraseña</button>
          </form>
        </div>

        <p class="text-center small text-secondary mt-4 mb-0">
          <a href="login.html" class="text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i>Volver a iniciar sesión</a>
        </p>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../js/controllers/recuperar_contrasena_controller.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <script src="../js/controllers/fetch_con_credenciales.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2D60A1">
  <meta name="description" content="Citas, vacunas e historial clínico de tu mascota.">
  <title>Detalle de la mascota | PetCore</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Tema (claro/oscuro/sistema): DESPUÉS de Bootstrap para poder sobreponer
       sus variables --bs-* y ANTES de style.css / que pinte nada. -->
  <script src="../js/services/sesion_temprana_service.js"></script>
  <script src="../js/controllers/tema_temprano.js"></script>
  <!-- Estilos propios -->
  <link href="../css/style.css" rel="stylesheet">
  <!-- Animaciones (Preferencias > Accesibilidad puede desactivarlas) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body class="pc-con-header">

  <!-- ================== HEADER SUPERIOR ================== -->
  <header class="pc-header">
    <div class="pc-header-inner">
      <a class="pc-header-btn" href="mascotas.html" aria-label="Volver atrás">
        <i class="fa fa-arrow-left"></i>
      </a>
      <h1 class="pc-header-titulo skeleton skeleton-claro skeleton-texto" id="pcTituloHeader">Detalles</h1>
      <span aria-hidden="true"></span>
    </div>
  </header>

  <!-- ================== CONTENIDO ================== -->
  <main class="container pc-lienzo py-4">
    <!-- Carnet: se arma desde js/controllers/mascota_detalle_controller.js -->
    <section class="pc-carnet mb-4 animate__animated animate__fadeInUp animate__faster" id="pcCarnet" aria-live="polite">
      <div class="d-flex flex-column align-items-center">
        <div class="pc-retrato pc-retrato-xl skeleton skeleton-claro skeleton-circulo mx-auto"></div>
        <div class="skeleton skeleton-claro mt-3" style="width:110px;height:11px;border-radius:4px"></div>
        <div class="skeleton skeleton-claro mt-2 mb-2" style="width:150px;height:22px;border-radius:4px"></div>
        <div class="skeleton skeleton-claro" style="width:90px;height:22px;border-radius:999px"></div>
      </div>
      <dl class="pc-carnet-datos">
        <div><dt>Edad</dt><dd><span class="skeleton skeleton-claro skeleton-texto"></span></dd></div>
        <div><dt>Peso</dt><dd><span class="skeleton skeleton-claro skeleton-texto"></span></dd></div>
        <div><dt>Sexo</dt><dd><span class="skeleton skeleton-claro skeleton-texto"></span></dd></div>
      </dl>
    </section>

    <!-- Cartilla digital: descarga en PDF (vacunas y antiparasitarios) para llevar el control -->
    <button type="button" class="btn btn-outline-primary w-100 mb-4 d-none" id="pcBtnCartilla">
      <i class="fa-solid fa-file-arrow-down me-2"></i>Descargar cartilla digital (PDF)
    </button>

    <section class="pc-card p-3 p-sm-4">
      <ul class="nav pc-tabs mb-3" id="pcTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="tabCitas" data-bs-toggle="tab" data-bs-target="#panelCitas"
                  type="button" role="tab" aria-controls="panelCitas" aria-selected="true">
            <i class="fa-regular fa-calendar-check me-2"></i>Citas
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tabVacunas" data-bs-toggle="tab" data-bs-target="#panelVacunas"
                  type="button" role="tab" aria-controls="panelVacunas" aria-selected="false">
            <i class="fa-solid fa-syringe me-2"></i>Vacunas
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tabHistorial" data-bs-toggle="tab" data-bs-target="#panelHistorial"
                  type="button" role="tab" aria-controls="panelHistorial" aria-selected="false">
            <i class="fa-solid fa-notes-medical me-2"></i>Historial clínico
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tabCuidados" data-bs-toggle="tab" data-bs-target="#panelCuidados"
                  type="button" role="tab" aria-controls="panelCuidados" aria-selected="false">
            <i class="fa-solid fa-heart-pulse me-2"></i>Cuidados
          </button>
        </li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="panelCitas" role="tabpanel" aria-labelledby="tabCitas" tabindex="0">
          <div id="pcCitas">
            <div class="skeleton skeleton-linea mb-3"></div>
            <div class="skeleton skeleton-linea" style="width:70%"></div>
          </div>
        </div>
        <div class="tab-pane fade" id="panelVacunas" role="tabpanel" aria-labelledby="tabVacunas" tabindex="0">
          <div id="pcVacunas"></div>
        </div>
        <div class="tab-pane fade" id="panelHistorial" role="tabpanel" aria-labelledby="tabHistorial" tabindex="0">
          <div id="pcHistorial"></div>
        </div>
        <div class="tab-pane fade" id="panelCuidados" role="tabpanel" aria-labelledby="tabCuidados" tabindex="0">
          <div id="pcCuidados"></div>
        </div>
      </div>
    </section>

    <div style="height:24px"></div>
  </main>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../js/controllers/mascota_detalle_controller.js"></script>
</body>
</html>
